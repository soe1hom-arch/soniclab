<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" fill="none">
  <defs>
    <linearGradient id="bg" x1="160" y1="70" x2="1290" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0B10"/>
      <stop offset="1" stop-color="#15121D"/>
    </linearGradient>
    <linearGradient id="glow" x1="874" y1="110" x2="1290" y2="778" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9E78E8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6650B8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D5C2FF"/>
      <stop offset="1" stop-color="#9E78E8"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5A378F"/>
      <stop offset=".55" stop-color="#261B43"/>
      <stop offset="1" stop-color="#11121B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
  </defs>

  <rect width="1440" height="1040" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="418" r="250" fill="#8D67D4" fill-opacity=".17" filter="url(#softGlow)"/>

  <!-- Top navigation -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="88" y="42" width="38" height="38" rx="12" fill="url(#accent)"/>
    <path d="M105 52v18m-7-9h14" stroke="#211833" stroke-width="2.5" stroke-linecap="round"/>
    <text x="139" y="68" fill="#F4F1F8" font-size="20" font-weight="700" letter-spacing="-.4">SonicLab</text>
    <text x="833" y="67" fill="#B8B1C5" font-size="14" font-weight="500">Fitur</text>
    <text x="906" y="67" fill="#B8B1C5" font-size="14" font-weight="500">Privasi</text>
    <text x="990" y="67" fill="#B8B1C5" font-size="14" font-weight="500">Open source</text>
    <rect x="1135" y="42" width="217" height="42" rx="14" fill="#C5A6FF"/>
    <text x="1162" y="68" fill="#241637" font-size="14" font-weight="700">Lihat di GitHub</text>
    <path d="M1297 57h18m-7-7 7 7-7 7" stroke="#241637" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hero copy -->
    <rect x="90" y="176" width="188" height="30" rx="15" fill="#211B2C" stroke="#44345E"/>
    <circle cx="108" cy="191" r="4" fill="#C5A6FF"/>
    <text x="121" y="196" fill="#D3C4EB" font-size="11" font-weight="700" letter-spacing="1.15">MUSIC, REFINED</text>

    <text x="88" y="287" fill="#F6F3FA" font-size="58" font-weight="750" letter-spacing="-2.6">Dengarkan musik.</text>
    <text x="88" y="354" fill="#F6F3FA" font-size="58" font-weight="750" letter-spacing="-2.6">Dengan cara Anda.</text>
    <text x="91" y="405" fill="#B8B1C5" font-size="18" font-weight="400">Pemutar musik lokal dengan kontrol suara dan alat audio</text>
    <text x="91" y="432" fill="#B8B1C5" font-size="18" font-weight="400">dalam satu pengalaman yang fokus dan privat.</text>

    <rect x="90" y="477" width="181" height="52" rx="16" fill="url(#accent)"/>
    <text x="116" y="509" fill="#241637" font-size="15" font-weight="700">Jelajahi proyek</text>
    <path d="M240 503h12m-5-5 5 5-5 5" stroke="#241637" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="285" y="477" width="167" height="52" rx="16" fill="#1D1A25" stroke="#393342"/>
    <text x="312" y="509" fill="#E7E1EF" font-size="15" font-weight="600">Lihat fitur</text>

    <circle cx="98" cy="578" r="4" fill="#9DDFCA"/>
    <text x="111" y="583" fill="#C2BDCA" font-size="13">Offline by design</text>
    <circle cx="263" cy="578" r="4" fill="#9DDFCA"/>
    <text x="276" y="583" fill="#C2BDCA" font-size="13">Tanpa akun</text>
    <circle cx="384" cy="578" r="4" fill="#9DDFCA"/>
    <text x="397" y="583" fill="#C2BDCA" font-size="13">Open source</text>

    <!-- Phone mockup -->
    <g filter="url(#shadow)">
      <rect x="844" y="113" width="300" height="628" rx="42" fill="#08080C" stroke="#4A4354" stroke-width="2"/>
      <rect x="857" y="127" width="274" height="600" rx="31" fill="#111018"/>
      <rect x="949" y="137" width="90" height="18" rx="9" fill="#08080C"/>
      <text x="878" y="180" fill="#F2EEF8" font-size="13" font-weight="700">9:41</text>
      <path d="M1073 169h3m5-3v6m6-9v9m6-12v12" stroke="#E7E1EF" stroke-width="1.4" stroke-linecap="round"/>
      <text x="884" y="223" fill="#F4F1F8" font-size="23" font-weight="700" letter-spacing="-.4">Sedang diputar</text>
      <text x="884" y="247" fill="#9690A0" font-size="12">PENGALAMAN AUDIO LOKAL</text>

      <rect x="884" y="275" width="220" height="220" rx="28" fill="url(#art)"/>
      <circle cx="994" cy="385" r="73" stroke="#D2B9FF" stroke-opacity=".55" stroke-width="1.3"/>
      <circle cx="994" cy="385" r="55" stroke="#D2B9FF" stroke-opacity=".33" stroke-width="1.2"/>
      <circle cx="994" cy="385" r="37" fill="#17131F" stroke="#D2B9FF" stroke-opacity=".55"/>
      <path d="M994 348v37l27 15" stroke="#D6C1FF" stroke-width="2" stroke-linecap="round"/>
      <circle cx="994" cy="385" r="4" fill="#D6C1FF"/>
      <path d="M915 463c27-18 44-18 67-4s42 13 61-1 35-14 48-5" stroke="#C5A6FF" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>

      <text x="884" y="533" fill="#F4F1F8" font-size="20" font-weight="700">Midnight Signal</text>
      <text x="884" y="557" fill="#A8A1B2" font-size="14">SonicLab Sessions</text>
      <path d="M884 588h220" stroke="#383340"/>
      <rect x="884" y="588" width="94" height="3" rx="1.5" fill="#C5A6FF"/>
      <text x="884" y="611" fill="#9F98A9" font-size="10">1:24</text>
      <text x="1076" y="611" fill="#9F98A9" font-size="10">4:08</text>
      <path d="M916 655l-10 8 10 8v-16Zm2 0v16" fill="#D6D0DF"/>
      <circle cx="994" cy="663" r="24" fill="url(#accent)"/>
      <path d="M990 652v22l14-11-14-11Z" fill="#241637"/>
      <path d="M1070 655l10 8-10 8v-16Zm-2 0v16" fill="#D6D0DF"/>
    </g>

    <!-- Feature cards -->
    <rect x="88" y="687" width="386" height="201" rx="22" fill="#191720" stroke="#332E3C"/>
    <rect x="112" y="711" width="42" height="42" rx="13" fill="#2D2440"/>
    <path d="M122 734h3l3-10 5 17 4-12 3 5h4" stroke="#C5A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="791" fill="#F4F1F8" font-size="18" font-weight="700">Suara yang terasa milik Anda</text>
    <text x="112" y="821" fill="#AAA5B5" font-size="13">EQ 10-band, kontrol tone, ruang, dan efek</text>
    <text x="112" y="842" fill="#AAA5B5" font-size="13">spasial untuk membentuk pengalaman dengar.</text>

    <rect x="495" y="687" width="386" height="201" rx="22" fill="#191720" stroke="#332E3C"/>
    <rect x="519" y="711" width="42" height="42" rx="13" fill="#202D31"/>
    <path d="M540 719v13l8 5m-8-22a12 12 0 1 0 12 12" stroke="#82DFF3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="519" y="791" fill="#F4F1F8" font-size="18" font-weight="700">Alat audio, langsung di perangkat</text>
    <text x="519" y="821" fill="#AAA5B5" font-size="13">Analisis, konversi, edit, dan ukur loudness</text>
    <text x="519" y="842" fill="#AAA5B5" font-size="13">tanpa mengirim koleksi musik ke cloud.</text>

    <rect x="902" y="687" width="450" height="201" rx="22" fill="#191720" stroke="#332E3C"/>
    <rect x="926" y="711" width="42" height="42" rx="13" fill="#203129"/>
    <path d="M947 719l10 4v7c0 7-5 11-10 13-5-2-10-6-10-13v-7l10-4Z" stroke="#9DDFCA" stroke-width="2" stroke-linejoin="round"/>
    <path d="m943 730 3 3 6-7" stroke="#9DDFCA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="926" y="791" fill="#F4F1F8" font-size="18" font-weight="700">Privasi sebagai standar</text>
    <text x="926" y="821" fill="#AAA5B5" font-size="13">Tidak meminta izin Internet. Pemutaran dan</text>
    <text x="926" y="842" fill="#AAA5B5" font-size="13">pemrosesan audio berlangsung secara lokal.</text>

    <text x="88" y="960" fill="#8D8797" font-size="12">SONICLAB  ·  PEMUTAR MUSIK & TOOLKIT AUDIO ANDROID</text>
    <text x="1164" y="960" fill="#8D8797" font-size="12">OPEN SOURCE  ·  APACHE-2.0</text>
