<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" fill="none">
  <defs>
    <linearGradient id="bg" x1="125" y1="40" x2="1300" y2="1030" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07060B"/>
      <stop offset=".58" stop-color="#0C0912"/>
      <stop offset="1" stop-color="#120B1B"/>
    </linearGradient>
    <radialGradient id="violetAura" cx="0" cy="0" r="1" gradientTransform="matrix(0 440 -520 0 1080 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8F54F6" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#6033A6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#31164E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E0CEFF"/>
      <stop offset=".5" stop-color="#C19AFF"/>
      <stop offset="1" stop-color="#9E68F2"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8C51D5"/>
      <stop offset=".48" stop-color="#38205D"/>
      <stop offset="1" stop-color="#120F1A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#191322"/>
      <stop offset="1" stop-color="#100E16"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000" flood-opacity=".7"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1440" height="1040" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="1040" rx="28" fill="url(#violetAura)"/>
  <circle cx="1090" cy="390" r="230" fill="#A264FF" fill-opacity=".2" filter="url(#glow)"/>
  <path d="M0 620C240 550 420 710 676 626s457-141 764-62" stroke="#A875F5" stroke-opacity=".12"/>
  <path d="M0 635C250 565 430 725 686 641s447-141 754-62" stroke="#A875F5" stroke-opacity=".06"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- Header -->
    <rect x="88" y="42" width="40" height="40" rx="13" fill="url(#accent)"/>
    <path d="M108 51v22m-8-11h16" stroke="#21132F" stroke-width="2.8" stroke-linecap="round"/>
    <text x="142" y="69" fill="#FAF7FF" font-size="20" font-weight="750" letter-spacing="-.5">SonicLab</text>
    <text x="836" y="67" fill="#C0B5D0" font-size="14" font-weight="550">Fitur</text>
    <text x="909" y="67" fill="#C0B5D0" font-size="14" font-weight="550">Privasi</text>
    <text x="993" y="67" fill="#C0B5D0" font-size="14" font-weight="550">Open source</text>
    <rect x="1135" y="42" width="217" height="44" rx="15" fill="url(#accent)"/>
    <text x="1162" y="69" fill="#21132F" font-size="14" font-weight="750">Lihat di GitHub</text>
    <path d="M1297 58h18m-7-7 7 7-7 7" stroke="#21132F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hero -->
    <rect x="90" y="174" width="188" height="31" rx="15.5" fill="#21152D" stroke="#65428D" stroke-opacity=".8"/>
    <circle cx="108" cy="189.5" r="4" fill="#D3B7FF"/>
    <text x="121" y="194" fill="#E0D0F6" font-size="11" font-weight="750" letter-spacing="1.2">MUSIC, REFINED</text>

    <text x="88" y="289" fill="#FBF9FF" font-size="60" font-weight="780" letter-spacing="-2.8">Dengarkan musik.</text>
    <text x="88" y="357" fill="#D7C2FF" font-size="60" font-weight="780" letter-spacing="-2.8">Dengan cara Anda.</text>
    <text x="91" y="409" fill="#C2B9CF" font-size="18" font-weight="400">Pemutar musik lokal dengan kontrol suara dan alat audio</text>
    <text x="91" y="436" fill="#C2B9CF" font-size="18" font-weight="400">dalam satu pengalaman yang fokus dan privat.</text>

    <rect x="90" y="480" width="181" height="53" rx="16" fill="url(#accent)"/>
    <text x="116" y="513" fill="#21132F" font-size="15" font-weight="750">Jelajahi proyek</text>
    <path d="M240 506h12m-5-5 5 5-5 5" stroke="#21132F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="285" y="480" width="167" height="53" rx="16" fill="#15111C" stroke="#574768"/>
    <text x="312" y="513" fill="#F0EAF8" font-size="15" font-weight="650">Lihat fitur</text>

    <circle cx="98" cy="581" r="4" fill="#B5E5D2"/>
    <text x="111" y="586" fill="#D0C8D9" font-size="13">Offline by design</text>
    <circle cx="263" cy="581" r="4" fill="#B5E5D2"/>
    <text x="276" y="586" fill="#D0C8D9" font-size="13">Tanpa akun</text>
    <circle cx="384" cy="581" r="4" fill="#B5E5D2"/>
    <text x="397" y="586" fill="#D0C8D9" font-size="13">Open source</text>

    <!-- Illustrative device mockup: replace with a real app capture before publication -->
    <g filter="url(#shadow)">
      <rect x="844" y="111" width="300" height="630" rx="43" fill="#07060A" stroke="#765C91" stroke-opacity=".75" stroke-width="1.5"/>
      <rect x="857" y="124" width="274" height="604" rx="32" fill="#100D16"/>
      <rect x="949" y="135" width="90" height="18" rx="9" fill="#07060A"/>
      <text x="878" y="178" fill="#F6F1FB" font-size="13" font-weight="700">9:41</text>
      <path d="M1073 167h3m5-3v6m6-9v9m6-12v12" stroke="#F0EAF8" stroke-width="1.4" stroke-linecap="round"/>
      <text x="884" y="222" fill="#FBF8FF" font-size="23" font-weight="720" letter-spacing="-.5">Sedang diputar</text>
      <text x="884" y="247" fill="#A89DB6" font-size="11" font-weight="650" letter-spacing=".7">PENGALAMAN AUDIO LOKAL</text>

      <rect x="884" y="275" width="220" height="220" rx="29" fill="url(#art)"/>
      <circle cx="994" cy="385" r="75" stroke="#E1C9FF" stroke-opacity=".72" stroke-width="1.4"/>
      <circle cx="994" cy="385" r="56" stroke="#E1C9FF" stroke-opacity=".42" stroke-width="1.2"/>
      <circle cx="994" cy="385" r="37" fill="#1C1426" stroke="#E1C9FF" stroke-opacity=".7"/>
      <path d="M994 348v37l27 15" stroke="#E4D0FF" stroke-width="2" stroke-linecap="round"/>
      <circle cx="994" cy="385" r="4" fill="#E4D0FF"/>
      <path d="M915 463c27-18 44-18 67-4s42 13 61-1 35-14 48-5" stroke="#D1ACFF" stroke-opacity=".9" stroke-width="2" stroke-linecap="round"/>

      <text x="884" y="533" fill="#FBF8FF" font-size="20" font-weight="720">Midnight Signal</text>
      <text x="884" y="557" fill="#B4AABD" font-size="14">SonicLab Sessions</text>
      <path d="M884 588h220" stroke="#403649"/>
      <rect x="884" y="588" width="94" height="3" rx="1.5" fill="#CDAAFF"/>
      <text x="884" y="611" fill="#ABA1B5" font-size="10">1:24</text>
      <text x="1076" y="611" fill="#ABA1B5" font-size="10">4:08</text>
      <path d="M916 655l-10 8 10 8v-16Zm2 0v16" fill="#E6DCEC"/>
      <circle cx="994" cy="663" r="25" fill="url(#accent)"/>
      <path d="M990 652v22l14-11-14-11Z" fill="#21132F"/>
      <path d="M1070 655l10 8-10 8v-16Zm-2 0v16" fill="#E6DCEC"/>
    </g>

    <!-- Benefits -->
    <rect x="88" y="690" width="386" height="201" rx="23" fill="url(#card)" stroke="#49365E"/>
    <rect x="112" y="714" width="42" height="42" rx="14" fill="#332044"/>
    <path d="M122 737h3l3-10 5 17 4-12 3 5h4" stroke="#D1ACFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="794" fill="#F8F4FC" font-size="18" font-weight="720">Suara yang terasa milik Anda</text>
    <text x="112" y="824" fill="#B9B0C2" font-size="13">EQ 10-band, kontrol tone, ruang, dan efek</text>
    <text x="112" y="845" fill="#B9B0C2" font-size="13">spasial untuk membentuk pengalaman dengar.</text>

    <rect x="495" y="690" width="386" height="201" rx="23" fill="url(#card)" stroke="#49365E"/>
    <rect x="519" y="714" width="42" height="42" rx="14" fill="#202A32"/>
    <path d="M540 722v13l8 5m-8-22a12 12 0 1 0 12 12" stroke="#91DFF1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="519" y="794" fill="#F8F4FC" font-size="18" font-weight="720">Alat audio, langsung di perangkat</text>
    <text x="519" y="824" fill="#B9B0C2" font-size="13">Analisis, konversi, edit, dan ukur loudness</text>
    <text x="519" y="845" fill="#B9B0C2" font-size="13">tanpa mengirim koleksi musik ke cloud.</text>

    <rect x="902" y="690" width="450" height="201" rx="23" fill="url(#card)" stroke="#49365E"/>
    <rect x="926" y="714" width="42" height="42" rx="14" fill="#203129"/>
    <path d="M947 722l10 4v7c0 7-5 11-10 13-5-2-10-6-10-13v-7l10-4Z" stroke="#A8E5CE" stroke-width="2" stroke-linejoin="round"/>
    <path d="m943 733 3 3 6-7" stroke="#A8E5CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="926" y="794" fill="#F8F4FC" font-size="18" font-weight="720">Privasi sebagai standar</text>
    <text x="926" y="824" fill="#B9B0C2" font-size="13">Tidak meminta izin Internet. Pemutaran dan</text>
    <text x="926" y="845" fill="#B9B0C2" font-size="13">pemrosesan audio berlangsung secara lokal.</text>

    <text x="88" y="963" fill="#958A9F" font-size="12" font-weight="600" letter-spacing=".35">SONICLAB  ·  PEMUTAR MUSIK & TOOLKIT AUDIO ANDROID</text>
    <text x="1151" y="963" fill="#958A9F" font-size="12" font-weight="600" letter-spacing=".35">OPEN SOURCE  ·  APACHE-2.0</text>
  </g>
</svg>
