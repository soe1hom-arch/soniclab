name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          # Find sdkmanager binary
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then
            SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew test --console=plain --no-daemon

      - name: Record release runtime dependencies
        run: |
          mkdir -p build/release-audit
          ./gradlew :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --console=plain --no-daemon \
            > build/release-audit/release-runtime-dependencies.txt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Record release APK native libraries
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if grep -Eiq 'org\.tensorflow:tensorflow-lite' \
            build/release-audit/release-runtime-dependencies.txt; then
            echo "TensorFlow Lite runtime must not be reintroduced without a license audit." >&2
            exit 1
          fi
          if unzip -l "$APK" | grep -Eiq 'libtensorflowlite_jni\.so|assets/.*\.tflite'; then
            echo "TensorFlow Lite binaries/models must not be packaged without a license audit." >&2
            exit 1
          fi
          unzip -l "$APK" | awk '/ lib\/.*\.so$/ {print $4}' \
            | sort -u > build/release-audit/release-native-libraries.txt
          sha256sum "$APK" > build/release-audit/release-apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: soniclab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK and dependency audit
        uses: actions/upload-artifact@v7
        with:
          name: soniclab-release-audit
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build/release-audit/*
          if-no-files-found: error
